name: CI

on:
  push:
    branches: [stable, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENAQ_API_KEY: "${{ secrets.OPENAQ_API_KEY }}"
  # Opt into Node.js 24 for JavaScript actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # TODO: Investigate and re-enable Python 3.11 on Windows once SSL/network issues are resolved.
          - os: windows-latest
            python-version: "3.11"

    # This default shell configuration is critical for Windows compatibility
    # with micromamba. It ensures Git Bash is used and the env is activated.
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v6

      # Every leg builds the same conda-forge environment from
      # environment-dev.yml. conda-forge is the only source that ships grib2io
      # with its bundled NCEPLIBS-g2c (no apt, no source compile); PyPI is
      # sdist-only and cannot build without g2c.
      - name: Set up conda environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-dev.yml
          environment-name: monetio-dev
          cache-environment: true
          # Initialize bash so the env is activated for every runner's steps,
          # including Windows Git Bash.
          init-shell: bash
          create-args: >-
            python=${{ matrix.python-version }}

      # grib2io has no win-64 build on conda-forge, so it is installed only on
      # the Unix legs. On Windows the grib2io-backed tests skip via
      # pytest.importorskip("grib2io").
      - name: Install grib2io (Unix)
        if: runner.os != 'Windows'
        run: micromamba install -y -n monetio-dev -c conda-forge grib2io

      - name: Test with pytest
        run: pytest -n auto --dist loadgroup -v -ra -W "ignore:Downloading test file:UserWarning::"

      - name: Test with pytspack installed
        run: |
          pip install "git+https://github.com/noaa-oar-arl/pytspack.git"
          pytest -k with_pytspack -n auto -v -ra -W "ignore:API key length is 0:UserWarning::"

  docs:
    name: Check docs build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: mkdocs build
        run: uv run --extra docs python -m mkdocs build
