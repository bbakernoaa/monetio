name: CI

on:
  push:
    branches: [stable, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENAQ_API_KEY: "${{ secrets.OPENAQ_API_KEY }}"

jobs:
  test:
    name: Test (Py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[test]"

      - name: Test with pytest
        run: pytest -n auto --dist loadgroup -v -ra -W "ignore:Downloading test file:UserWarning::"

      - name: Test with pytspack installed
        run: |
          uv pip install --system "git+https://github.com/noaa-oar-arl/pytspack.git"
          pytest -k with_pytspack -n auto -v -ra -W "ignore:API key length is 0:UserWarning::"

  docs:
    name: Check docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.12
          enable-cache: true

      - name: Install docs dependencies
        run: |
          uv pip install --system -e ".[docs]"

      - name: mkdocs build
        run: python -m mkdocs build
