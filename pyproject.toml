[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",  # module level import not at top of file
    "E501",  # line too long
    "E722",  # do not use bare 'except'
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monetio"
dynamic = ["version"]
description = "The Model and Observation Evaluation Toolkit (MONET) I/O package"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Barry D. Baker", email = "barry.baker@noaa.gov"},
]
maintainers = [
    {name = "Barry D. Baker", email = "barry.baker@noaa.gov"},
]
urls = {"Homepage" = "https://github.com/noaa-oar-arl/monetio"}
dependencies = [
    "dask",
    "netCDF4",
    "pandas",
    "xarray",
    "requests",
    "h5netcdf",
    "h5py",
    "pyproj",
    "pyarrow"
]

[project.scripts]
monetio = "monetio.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "monetio.__version__"}

[project.optional-dependencies]
all = [
    "s3fs",
    "scipy",
    "pyhdf!=0.11.3",
    "timezonefinder",
]
dev = [
    "monetio[all]",
    "pytest",
    "pytest-cov",
    "pytest-print",
    "pytest-xdist",
    "filelock",
    "ruff",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index"
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index"
]

test = [
    "monetio[all]",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "filelock"
]

virtualizarr = [
    "virtualizarr>=1.0",
    "obstore",
    "obspec_utils",
    "ujson",
    "zarr>=3.1,<3.2",
]

icechunk = [
    "icechunk>=0.1",
    "monetio[virtualizarr]",
]


[tool.setuptools]
packages = ["monetio", "monetio.models", "monetio.obs", "monetio.profile", "monetio.readers", "monetio.sat"]
package-data = {"monetio" = ["data/*.csv", "data/*.tsv", "data/*.txt", "data/*.png"]}


[tool.pytest.ini_options]
markers = [
    "network: tests that require network access",
]
filterwarnings = [
    "ignore:The distutils package is deprecated:DeprecationWarning:joblib.backports",
    "ignore:The error_bad_lines argument has been deprecated:FutureWarning::",
    "ignore:The warn_bad_lines argument has been deprecated:FutureWarning::",
    "ignore:The NPY_CHAR type_num is deprecated. Please port your code to use NPY_STRING instead.:DeprecationWarning::",
    "ignore:'cgi' is deprecated and slated for removal in Python 3.13:DeprecationWarning::",
    "ignore:The default dtype for empty Series will be 'object' instead of 'float64' in a future version. Specify a dtype explicitly to silence this warning.:FutureWarning::",
    "ignore:np.find_common_type is deprecated.:DeprecationWarning::",
    "ignore:The current Dask DataFrame implementation is deprecated.:DeprecationWarning::",
]

[tool.ruff.lint.isort]
combine-as-imports = true
